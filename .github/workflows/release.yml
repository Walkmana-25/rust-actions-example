name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v*

env:
  CARGO_TERM_COLOR: always

jobs:
  Test:
    uses: ./.github/workflows/testing.yml

  build:
    needs: [Test]
    runs-on: ${{ matrix.runner }}
    env:
      PROJECT_NAME: rust-actions-example
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: "x86_64-unknown-linux"
            extension: ""
            runner: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            name: "x86_64-pc-windows-msvc"
            extension: ".exe"
            runner: windows-latest
            cross: false
          - target: x86_64-apple-darwin
            name: "x86_64-apple-darwin"
            extension: ""
            runner: macos-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            name: "aarch64-unknown-linux"
            extension: ""
            runner: ubuntu-latest
            cross: true
          - target: aarch64-pc-windows-msvc
            name: "aarch64-pc-windows-msvc"
            extension: ".exe"
            runner: windows-latest
            cross: false
          - target: aarch64-apple-darwin
            name: "aarch64-apple-darwin"
            extension: ""
            runner: macos-latest
            cross: false
          - target: armv7-unknown-linux-gnueabihf
            name: "armv7-unknown-linux"
            extension: ""
            runner: ubuntu-latest
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: |
          if [[ "${{ matrix.runner }}" == "windows-latest" ]]; then
            choco install make --yes
          elif [[ "${{ matrix.runner }}" == "macos-latest" ]]; then
            brew install make
          fi

      - name: Install cross (if needed)
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Project
        run: |
          if ${{ matrix.cross }}; then
            cross build --release --target ${{ matrix.target }} --verbose
          else
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }} --verbose

      - name: Rename Artifacts
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/${{ env.PROJECT_NAME }}{,-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.extension }}}

      - name: Release Artifacts
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            target/${{ matrix.target }}/release/${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.name }}${{ matrix.extension }}
